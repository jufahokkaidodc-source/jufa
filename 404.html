<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜北海道学生サッカー連盟</title>
<script>
/* 見つからないページ（GitHub Pages がこのファイルを出す）
 *  ・チームの独自ホームページの分かりやすいアドレス（/clubs/アドレス名/）は、clubs/?u=アドレス名 に移す（#ページ名 も引き継ぐ）
 *  ・それ以外は、この「見つかりません」の案内を出す */
(function () {
  var m = location.pathname.match(/^(.*\/)clubs\/([a-z0-9][a-z0-9-]{1,29})\/?(?:index\.html)?$/i);
  if (m) location.replace(m[1] + 'clubs/?u=' + encodeURIComponent(m[2].toLowerCase()) + location.hash);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--card:#1a1a1a;--ink:#f2f2f2;--muted:#9aa0a6;--red:#E60012;--link:#ff4d57}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;line-height:1.7}
header{background:#fff;color:#111;padding:14px 16px;font-weight:700;box-shadow:0 1px 0 #e5e5e5}
header a{color:#111;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:32px 16px}
.card{background:var(--card);border-radius:12px;padding:20px;border-top:4px solid var(--red)}
h1{font-size:20px;margin:0 0 8px}
p{margin:8px 0;color:var(--muted)}
a.btn{display:inline-block;margin-top:12px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px}
.links a{color:var(--link);margin-right:14px}
</style>
</head>
<body>
<header><a href="/new/">北海道学生サッカー連盟</a></header>
<main>
  <div class="card">
    <h1>ページが見つかりません</h1>
    <p>アドレスがまちがっているか、ページが移動した可能性があります。</p>
    <a class="btn" href="/new/">トップページへ</a>
    <p class="links" style="margin-top:16px"><a href="/new/results.html">大会記録</a><a href="/new/news.html">お知らせ</a><a href="/clubs/">チームのホームページ</a></p>
  </div>
</main>
</body>
</html>
